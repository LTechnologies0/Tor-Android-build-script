# Dependabot cannot watch GitLab tags or shell pin files.
# This workflow polls upstreams and opens PRs against versions.properties.
name: Update upstream pins

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-upstream-pins
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest upstream tags
        id: tags
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, urllib.parse, urllib.request

          def get(url: str):
              req = urllib.request.Request(url, headers={"User-Agent": "tor-android-pin-bot"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          def gl_tag(project: str, pattern: str) -> str:
              enc = urllib.parse.quote(project, safe="")
              tags = get(f"https://gitlab.torproject.org/api/v4/projects/{enc}/repository/tags?per_page=30")
              pat = re.compile(pattern)
              for t in tags:
                  if pat.match(t["name"]):
                      return t["name"]
              raise SystemExit(f"no tag matching {pattern} in {project}")

          def gh_tag(repo: str, prefix: str) -> str:
              tags = get(f"https://api.github.com/repos/{repo}/tags?per_page=20")
              for t in tags:
                  n = t["name"]
                  if n.startswith(prefix) and "alpha" not in n.lower() and "beta" not in n.lower():
                      return n
              raise SystemExit(f"no tag with prefix {prefix} in {repo}")

          tor_up = gl_tag("tpo/core/tor", r"^tor-0\.4\.9\.\d+$")
          lyre = gl_tag("tpo/anti-censorship/pluggable-transports/lyrebird", r"^lyrebird-")
          openssl = gh_tag("openssl/openssl", "openssl-3.")
          zlib = gh_tag("madler/zlib", "v1.")
          conj = get(
              "https://gitlab.torproject.org/api/v4/projects/"
              "tpo%2Fanti-censorship%2Fpluggable-transports%2Fconjure"
              "/repository/commits?ref_name=main&per_page=1"
          )[0]["id"]

          lines = [
              f"tor_upstream={tor_up}",
              f"lyrebird={lyre}",
              f"openssl={openssl}",
              f"zlib={zlib}",
              f"conjure={conj}",
          ]
          print("\n".join(lines))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Apply bumps to versions.properties
        id: apply
        run: |
          set -euo pipefail
          F=versions.properties
          changed=false
          bump() {
            local key="$1" val="$2"
            local cur
            cur=$(grep -E "^${key}=" "$F" | cut -d= -f2- | tr -d '[:space:]')
            if [ "$cur" != "$val" ] && [ -n "$val" ]; then
              sed -i "s|^${key}=.*|${key}=${val}|" "$F"
              echo "bump $key: $cur -> $val"
              changed=true
            fi
          }
          bump tor.upstream.tag "${{ steps.tags.outputs.tor_upstream }}"
          bump lyrebird.ref "${{ steps.tags.outputs.lyrebird }}"
          bump openssl.ref "${{ steps.tags.outputs.openssl }}"
          bump zlib.ref "${{ steps.tags.outputs.zlib }}"
          bump conjure.ref "${{ steps.tags.outputs.conjure }}"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="deps/upstream-pins-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add versions.properties
          git commit -m "build(deps): bump upstream pins from GitLab/GitHub"
          git push -u origin "$BRANCH" --force
          if ! gh pr list --head "$BRANCH" --json number -q '.[0].number' | grep -q '[0-9]'; then
            gh pr create \
              --title "build(deps): bump upstream pins" \
              --body "Automated pin refresh from GitLab/GitHub. After merge, rebuild Tor+PTs release for OnionVPN."
          fi
