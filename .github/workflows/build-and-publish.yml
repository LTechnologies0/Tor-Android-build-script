# Build Tor + pluggable transports and publish GitHub Release assets for OnionVPN.
#
# All binaries are built from source in this repository (no foreign-CI republish).
#
# Tags:
#   tor-*  — full publish (libtor + PT build)
#   pt-*   — PT binaries only
name: Build and publish Tor + PTs

on:
  push:
    tags:
      - "tor-*"
      - "pt-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. tor-0.4.9.11-dev+pts or pt-2026.07.31)"
        required: true
        default: "pt-nightly"
      build_tor:
        description: "Build libtor.so from source (OpenSSL/libevent/zstd/xz/Tor)"
        type: boolean
        default: true
      build_pts:
        description: "Build lyrebird + conjure from source"
        type: boolean
        default: true

permissions:
  contents: write

env:
  GOTOOLCHAIN: auto

jobs:
  build-tor:
    if: >
      startsWith(github.ref, 'refs/tags/tor-') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_tor)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            autoconf autogen automake autopoint autotools-dev \
            gettext-base git libtool make patch pkg-config \
            ca-certificates curl gzip tar unzip wget python3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Build libtor (${{ matrix.abi }})
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ABIS: ${{ matrix.abi }}
          # arm64 gets -fsanitize=memtag via ENABLE_MTE=1 in build-libtor.sh
          ENABLE_MTE: "1"
        run: |
          chmod +x scripts/build-libtor.sh
          ./scripts/build-libtor.sh

      - name: Upload libtor artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtor-${{ matrix.abi }}
          path: dist/tor/libtor-*.so
          if-no-files-found: error

  build-pts:
    if: >
      startsWith(github.ref, 'refs/tags/pt-') ||
      startsWith(github.ref, 'refs/tags/tor-') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_pts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Build pluggable transports
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ABIS: arm64-v8a x86_64
          API_LEVEL: "21"
        run: |
          chmod +x scripts/build-pluggable-transports.sh
          ./scripts/build-pluggable-transports.sh

      - name: Upload PT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pluggable-transports
          path: |
            dist/pts/**
          if-no-files-found: error

  publish:
    needs: [build-tor, build-pts]
    if: always() && (needs.build-tor.result == 'success' || needs.build-tor.result == 'skipped') && (needs.build-pts.result == 'success' || needs.build-pts.result == 'skipped') && (needs.build-tor.result == 'success' || needs.build-pts.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          BUILD_TOR=false
          BUILD_PTS=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_TOR="${{ inputs.build_tor }}"
            BUILD_PTS="${{ inputs.build_pts }}"
          elif [[ "$TAG" == tor-* ]]; then
            BUILD_TOR=true
            BUILD_PTS=true
          elif [[ "$TAG" == pt-* ]]; then
            BUILD_PTS=true
          fi
          echo "build_tor=$BUILD_TOR" >> "$GITHUB_OUTPUT"
          echo "build_pts=$BUILD_PTS" >> "$GITHUB_OUTPUT"

      - name: Download libtor artifacts
        if: steps.meta.outputs.build_tor == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: libtor-*
          path: dist/tor-artifacts
          merge-multiple: true

      - name: Download PT artifacts
        if: steps.meta.outputs.build_pts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: pluggable-transports
          path: dist/pts

      - name: Stage release assets
        run: |
          mkdir -p dist/release dist/tor
          if [ "${{ steps.meta.outputs.build_tor }}" = "true" ]; then
            find dist/tor-artifacts -name 'libtor-*.so' -exec cp -f {} dist/tor/ \;
            cp -f dist/tor/libtor-*.so dist/release/
          fi
          if [ "${{ steps.meta.outputs.build_pts }}" = "true" ] && [ -d dist/pts ]; then
            for abi in arm64-v8a x86_64; do
              [[ -f "dist/pts/$abi/libLyrebird.so" ]] && cp -f "dist/pts/$abi/libLyrebird.so" "dist/release/libLyrebird-${abi}.so"
              [[ -f "dist/pts/$abi/libConjure.so" ]] && cp -f "dist/pts/$abi/libConjure.so" "dist/release/libConjure-${abi}.so"
            done
            [[ -f dist/pts/CLIENT_TRANSPORT_PLUGIN.txt ]] && cp -f dist/pts/CLIENT_TRANSPORT_PLUGIN.txt dist/release/
          fi
          ls -lh dist/release/
          (cd dist/release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Guard: never ship empty tor when build_tor requested
          if [ "${{ steps.meta.outputs.build_tor }}" = "true" ]; then
            test -f dist/release/libtor-arm64-v8a.so
            test -f dist/release/libtor-x86_64.so
          fi

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES="$(cat <<EOF
          ## Tor Android + pluggable transports (OnionVPN)

          Controlled **from-source** builds for [OnionVPN](https://github.com/LTechnologies0/OnionVPN).
          No binaries are republished from third-party CI.

          ### Tor (\`libtor-<abi>.so\`)
          - Built here via \`scripts/build-libtor.sh\` + \`external/Makefile\`
          - Deps: OpenSSL, libevent, zstd, xz, Gedsh \`tor\` (\`prod-0.4.9\`)
          - NDK r28c, 16 KB page size on 64-bit ABIs
          - **arm64**: optional MTE instrumentation (\`-fsanitize=memtag\`) for GrapheneOS / \`memtagMode\` apps

          ### Pluggable transports
          - \`libLyrebird-<abi>.so\` — meek_lite, obfs2/3/4, scramblesuit, webtunnel, snowflake
          - \`libConjure-<abi>.so\` — conjure
          - Linked with \`-Wl,-z,max-page-size=16384\` (Android 16 KB pages)
          - Go: \`-checklinkname=0\` (Tor Browser #41387)

          See \`CLIENT_TRANSPORT_PLUGIN.txt\` for torrc lines.

          Verify: \`sha256sum -c SHA256SUMS.txt\`
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/release/* --title "$TAG" --notes "$NOTES"
          fi
