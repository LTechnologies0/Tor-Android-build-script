# Deprecated: libtor is no longer republished from Gedsh GitLab CI.
# Use "Build and publish Tor + PTs" (build-and-publish.yml) which builds
# libtor + pluggable transports from source in this repository.
name: Publish Tor binaries (retired)

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Type BUILD-FROM-SOURCE to confirm you will use build-and-publish.yml"
        required: true

permissions:
  contents: read

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse foreign-CI republish
        run: |
          echo "::error::publish-binaries.yml no longer republishes libtor from Gedsh GitLab."
          echo "Use Actions → Build and publish Tor + PTs (tags tor-* / pt-* or workflow_dispatch)."
          echo "Local: ANDROID_NDK_HOME=... ./scripts/build-libtor.sh"
          if [ "${{ inputs.acknowledge }}" != "BUILD-FROM-SOURCE" ]; then
            exit 1
          fi
          exit 1
