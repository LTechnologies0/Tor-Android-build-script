# Republish Tor Android libtor.so assets to GitHub Releases for OnionVPN.
# Trigger: push tag tor-*  OR  workflow_dispatch
name: Publish Tor binaries

on:
  push:
    tags:
      - "tor-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. tor-0.4.9.11-dev)"
        required: true
        default: "tor-0.4.9.11-dev"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/publish-github-release.sh
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          ./scripts/publish-github-release.sh "$TAG"
