# Single source of truth for Tor-Android-build-script pins.
# Dependabot cannot watch GitLab or git tag refs in shell scripts —
# see .github/workflows/update-upstream-pins.yml
#
# Override any key via env (OPENSSL_REF, TOR_REF, …) in build scripts.

# C stack (GitHub / tukaani)
openssl.ref=openssl-3.6.4
libevent.ref=release-2.1.12-stable
zstd.ref=v1.4.9
xz.ref=v5.2.4
xz.repo=https://git.tukaani.org/xz.git
zlib.ref=v1.3.2
zlib.repo=https://github.com/madler/zlib.git

# Tor — build from Gedsh Android fork; track TPO tags separately
tor.repo=https://gitlab.torproject.org/Gedsh/tor.git
tor.ref=prod-0.4.9
tor.upstream.project=tpo/core/tor
tor.upstream.tag=tor-0.4.9.13

# Pluggable transports (pin tags/SHA — never float on main in CI)
lyrebird.repo=https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird.git
lyrebird.ref=lyrebird-0.8.1
conjure.repo=https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/conjure.git
# conjure has no release tags; pin commit SHA
conjure.ref=0090962226b82aa4a8fc38506f9b98de67d0781e

# DNSCrypt-proxy (optional self-build; OnionVPN may still vendor until published)
dnscrypt.repo=https://github.com/DNSCrypt/dnscrypt-proxy.git
dnscrypt.ref=2.1.18

# Toolchain notes (Actions)
go.version=1.23.x
ndk.version=r28c
